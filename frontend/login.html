<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridGuard AI — Login</title>

    <!-- Google Fonts: Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- GridGuard AI Design System -->
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<div class="gg-login-layout">

    <!-- Background grid visual -->
    <div class="gg-login-layout__bg">
        <svg width="100%" height="100%" style="position:absolute;inset:0;opacity:0.04;">
            <defs>
                <pattern id="login-grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d4ff" stroke-width="0.5"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#login-grid)"/>
        </svg>
        <!-- Radial glow -->
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
                    width:600px;height:600px;border-radius:50%;
                    background:radial-gradient(circle,rgba(0,212,255,0.06) 0%,transparent 70%);
                    pointer-events:none;"></div>
    </div>

    <!-- Login Card -->
    <div class="gg-login-layout__card gg-animate-fade-in-up">

        <!-- Brand -->
        <div class="gg-login-layout__brand">
            <svg class="gg-login-layout__logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="2" width="28" height="28" rx="6" stroke="#00d4ff" stroke-width="2"/>
                <path d="M16 6 L16 26 M6 16 L26 16 M9 9 L23 23 M23 9 L9 23" stroke="#00d4ff" stroke-width="1.2" opacity="0.35"/>
                <circle cx="16" cy="16" r="4" fill="#00d4ff" opacity="0.85"/>
                <circle cx="16" cy="6"  r="2" fill="#00d4ff"/>
                <circle cx="16" cy="26" r="2" fill="#00d4ff"/>
                <circle cx="6"  cy="16" r="2" fill="#00d4ff"/>
                <circle cx="26" cy="16" r="2" fill="#00d4ff"/>
            </svg>
            <h1 class="gg-login-layout__title">Grid<span style="color:var(--accent-cyan);">Guard</span> AI</h1>
            <p class="gg-login-layout__tagline">Smart Grid Monitoring &amp; Cybersecurity Platform</p>
        </div>

        <!-- Error message (hidden by default) -->
        <div id="login-error" class="gg-alert gg-alert--critical" style="display:none;margin-bottom:var(--space-5);"></div>

        <!-- Login Form -->
        <form id="login-form" autocomplete="off">
            <div class="gg-form-group">
                <label class="gg-label" for="login-username">Email Address</label>
                <input type="text"
                       class="gg-input"
                       id="login-username"
                       placeholder="admin@gridguard.ai"
                       autocomplete="username"
                       required>
            </div>

            <div class="gg-form-group">
                <label class="gg-label" for="login-password">Password</label>
                <input type="password"
                       class="gg-input"
                       id="login-password"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit"
                    class="gg-btn gg-btn--primary gg-btn--lg gg-w-full"
                    id="btn-login"
                    style="margin-top:var(--space-2);">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 3a1 1 0 011 1v12a1 1 0 001 1h12a1 1 0 001-1V4a1 1 0 00-1-1H3zm11 4a1 1 0 10-2 0v4a1 1 0 102 0V7zm-4 0a1 1 0 10-2 0v4a1 1 0 102 0V7z" clip-rule="evenodd"/>
                </svg>
                Sign In
            </button>
        </form>

        <!-- Demo credentials hint -->
        <div style="margin-top:var(--space-6);padding:var(--space-3) var(--space-4);
                    background:var(--accent-cyan-muted);border:1px solid var(--accent-cyan-border);
                    border-radius:var(--radius-md);">
            <div style="font-size:var(--text-xs);font-weight:var(--font-semibold);
                        letter-spacing:var(--tracking-label);text-transform:uppercase;
                        color:var(--accent-cyan);margin-bottom:var(--space-2);">
                Demo Credentials
            </div>
            <div style="font-size:var(--text-sm);color:var(--text-secondary);">
                <span class="text-mono">admin@gridguard.ai</span> / <span class="text-mono">admin123</span>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- GridGuard AI — Auth Module (loads data.js dependency first) -->
<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>

</body>
</html>
